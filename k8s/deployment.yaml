apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-expense-api
  labels:
    app: ml-expense-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-expense-api
  template:
    metadata:
      labels:
        app: ml-expense-api
    spec:
      containers:
        - name: api
          image: caspiahmed/ml-expense-api:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_VERSION
              value: "v1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5